name: Build and deploy VPF Algorithm Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Build Mini App
        working-directory: src/VPFAlgorithmBot/ClientApp
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and run domain tests
        run: |
          dotnet restore VPFAlgorithmBot.slnx
          dotnet run --project tests/VPFAlgorithmBot.Tests/VPFAlgorithmBot.Tests.csproj --no-restore
      - name: Publish web project
        run: dotnet publish src/VPFAlgorithmBot/VPFAlgorithmBot.csproj -c Release -o publish --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_46BD1E48310D4385AFA7800F9C7DBC98 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C1600560E3C4748AA7BF24AE62FC3B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6903D4EE33B04AD8A7EDC99A95A38BEA }}
      - name: Check Azure startup configuration
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          resource_group = 'asp'
          app_name = 'VPFAlgorithmBot'
          def az_json(*args):
              return json.loads(subprocess.check_output(['az', *args, '-o', 'json'], text=True))

          app = az_json('webapp', 'show', '-g', resource_group, '-n', app_name)
          print('App state:', app.get('state'))
          print('Runtime:', (app.get('siteConfig') or {}).get('linuxFxVersion'))
          settings = {
              item['name']: item.get('value')
              for item in az_json('webapp', 'config', 'appsettings', 'list', '-g', resource_group, '-n', app_name)
          }
          required = (
              'Telegram__Mode', 'Telegram__BotToken', 'Telegram__WebhookSecret',
              'ConnectionStrings__BotDatabase', 'Admin__Password', 'Admin__BootstrapTelegramId',
          )
          for key in required:
              print(f'{key}: {"configured" if settings.get(key) else "MISSING"}')
          print('Admin__KeyPath:', 'configured' if settings.get('Admin__KeyPath') else 'using Azure writable default')
          if settings.get('Telegram__Mode') != 'Webhook':
              raise SystemExit('Telegram__Mode must be Webhook in Azure Production')
          if any(not settings.get(key) for key in required):
              raise SystemExit('Required App Service settings are missing; see docs/azure-deploy.md')
          if settings['Admin__Password'].startswith('@Microsoft.KeyVault('):
              raise SystemExit('Replace Admin__Password Key Vault reference with a direct App Service environment value')
          PY
      - name: Select web app startup DLL
        run: az webapp config set -g asp -n VPFAlgorithmBot --startup-file 'dotnet VPFAlgorithmBot.dll' -o none
      - name: Enable startup diagnostics
        run: az webapp log config -g asp -n VPFAlgorithmBot --docker-container-logging filesystem --level error -o none
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: VPFAlgorithmBot
          package: publish
      - name: Health check
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors --max-time 15 'https://vpfalgorithmbot-c6dshneadtdgenhw.westeurope-01.azurewebsites.net/health'
      - name: Classify startup failure
        if: failure()
        run: |
          python3 - <<'PY'
          import subprocess

          result = subprocess.run(
              ['az', 'webapp', 'log', 'startup', 'show', '-g', 'asp', '-n', 'VPFAlgorithmBot'],
              capture_output=True, text=True, timeout=30,
          )
          log = result.stdout + '\n' + result.stderr
          print('Startup log command succeeded:', result.returncode == 0)
          print('Startup log characters:', len(log))
          try:
              stream = subprocess.run(
                  ['az', 'webapp', 'log', 'tail', '-g', 'asp', '-n', 'VPFAlgorithmBot'],
                  capture_output=True, text=True, timeout=20,
              )
              stream_log = stream.stdout + '\n' + stream.stderr
          except subprocess.TimeoutExpired as exc:
              def decode(value):
                  return value.decode(errors='replace') if isinstance(value, bytes) else (value or '')
              stream_log = decode(exc.stdout) + '\n' + decode(exc.stderr)
          print('Log stream characters:', len(stream_log))
          log += '\n' + stream_log
          checks = {
              'SQL connection or migration failure': ('SqlException', 'SqlClient', 'Login failed', 'Cannot open server'),
              'Database network failure': ('network-related', 'TCP Provider', 'server was not found'),
              'Missing runtime configuration': ('is required', 'Unknown Telegram:Mode', 'Demo mode is available only'),
              'File access failure': ('UnauthorizedAccessException', 'Access to the path'),
              'Runtime startup failure': ('Failed to start', 'container did not respond', 'startup failed'),
          }
          matched = False
          for label, markers in checks.items():
              if any(marker.casefold() in log.casefold() for marker in markers):
                  print('Detected:', label)
                  matched = True
          if not matched:
              print('No recognized failure signature; inspect App Service > Monitoring > Log stream.')
          PY
