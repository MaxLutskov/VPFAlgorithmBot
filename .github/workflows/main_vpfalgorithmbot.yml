name: Build and deploy VPF Algorithm Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Build Mini App
        working-directory: src/VPFAlgorithmBot/ClientApp
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and run domain tests
        run: |
          dotnet restore VPFAlgorithmBot.slnx
          dotnet run --project tests/VPFAlgorithmBot.Tests/VPFAlgorithmBot.Tests.csproj --no-restore
      - name: Publish web project
        run: dotnet publish src/VPFAlgorithmBot/VPFAlgorithmBot.csproj -c Release -o publish --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_46BD1E48310D4385AFA7800F9C7DBC98 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C1600560E3C4748AA7BF24AE62FC3B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6903D4EE33B04AD8A7EDC99A95A38BEA }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: VPFAlgorithmBot
          package: publish
      - name: Health check
        run: curl --fail --show-error --silent --retry 10 --retry-delay 6 --retry-connrefused 'https://vpfalgorithmbot-c6dshneadtdgenhw.westeurope-01.azurewebsites.net/health'
